<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--link rel="stylesheet" href="styles.css"-->
    <title>Smart Control - Cadastro</title>
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <img src="assets/images/logo2dnv.png" alt="Logo Smart Control" width="150" height="150">

        <h1>Cadastro de Usuário</h1>

        <p>Preencha os dados para realizar seu cadastro.</p>

    </header>

    <hr>

    <!-- Navegations -->
    <nav>

        <ul>
            <li><a href="index.html">Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
        </ul>

    </nav>

    <hr>

    <!-- Formulário -->
    <main>

        <form action="dashboard.html" method="post">

            <label for="nome">Nome Completo:</label><br>
            <input
                type="text"
                id="nome"
                name="nome"
                minlength="3"
                placeholder="Harry potter da silva"
                required>

            <br><br>

            <label for="cpf">CPF:</label><br>
            <input
                type="text"
                id="cpf"
                name="cpf"
                minlength="14"
                maxlength="14"
                placeholder="000.000.000-00"
                required>

            <br><br>

            <label for="email">E-mail:</label><br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="harrypotter@silva123.com"
                required>

            <br><br>

            <label for="telefone">Telefone:</label><br>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(32) 99999-9999"
                required>

            <br><br>

            <label for="senha">Senha:</label><br>
            <input
                type="password"
                id="senha"
                name="senha"
                minlength="8"
                placeholder="**********"
                required>

            <br><br>

            <label for="cargo">Cargo:</label><br>

            <select id="cargo" name="cargo" required>

                <option value="">Selecione</option>
                <option>Administrador</option>
                <option>Supervisor</option>
                <option>Maluco</option>
                <option>Visitante</option>

            </select>

            <br><br>

            <label for="turno">Turno:</label><br>

            <select id="turno" name="turno" required>

                <option value="">Selecione</option>
                <option>Manhã</option>
                <option>Tarde</option>
                <option>Noite</option>
                <option>Integral</option>

            </select>

            <br><br>

            <p>Permissões:</p>

            <input type="checkbox" id="relatorios" name="permissoes">
            <label for="relatorios">Visualizar Relatórios</label>

            <input type="checkbox" id="usuarios" name="permissoes">
            <label for="usuarios">Gerenciar Usuários</label>

            <input type="checkbox" id="configuracoes" name="permissoes">
            <label for="configuracoes">Alterar Configurações</label>

            <br><br>

            <input
                type="checkbox"
                id="termos"
                name="termos"
                required>

            <label for="termos">
                Li e aceito os termos de uso.
            </label>

            <br><br>

            <button type="submit">Cadastrar</button>
            <button type="reset">Limpar</button>
    

        </form>

    </main>

    <hr>

    <!-- Rodapé -->
    <footer>

        <h3>Localização</h3>

        <iframe
            src="https://www.google.com/maps?q=Juiz%20de%20Fora%20MG&output=embed"
            width="400"
            height="250"
            style="border:0;"
            loading="lazy"
            allowfullscreen>
        </iframe>

        <p>&copy; 2026 - Smart Control</p>

    </footer>

</body>

</html>
