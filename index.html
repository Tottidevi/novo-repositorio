<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/images/styles.css"
    <title>Smart Control - Login</title>
</head>

<body>

    <!-- Cabeçalhim-->
    <header>
        <img src="assets/images/logo2dnv.png" alt="Logo Smart Control" width="150" height="150">

        <h1>Smart Control</h1>

        <p>Sistema de Controle de Acessos</p>
    </header>

    <hr>

    <!-- Formulário de Login -->
    <main>

        <h2>Faça seu login</h2>

        <form method="post" action="dashboard.html">

            <label for="nome_completo">Nome completo:</label><br>
            <input
                type="text"
                id="nome_completo"
                name="nome_completo"
                minlength="3"
                placeholder="Harry Potter da silva"
                required>

            <br><br>

            <label for="cpf">CPF:</label><br>
            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                minlength="14"
                maxlength="14"
                required>

            <br><br>

            <label for="email">E-mail:</label><br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="harrypotter@silva.com"
                required>

            <br><br>

            <label for="senha_padrao">Senha:</label><br>
            <input
                type="password"
                id="senha_padrao"
                name="senha_padrao"
                minlength="8"
                placeholder="*************"
                required>

            <br><br>

            <button type="submit">Entrar</button>

        </form>

        <br>

        <p>
            Ainda não possui cadastro ,zé?
            <a href="cadastro.html">Clique aqui para se cadastrar.</a>
        </p>

    </main>

    <hr>

    <!-- Rodapau -->
    <footer>

        <h3>Localização</h3>

        <iframe
            src="https://www.google.com/maps?q=Juiz%20de%20Fora%20MG&output=embed"
            width="400"
            height="250"
            style="border:0;"
            loading="lazy"
            allowfullscreen>
        </iframe>

        <p>&copy; 2026 - Smart Control</p>

    </footer>

</body>

</html>
